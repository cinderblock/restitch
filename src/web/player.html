<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>restitch</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  video { width: 100%; height: 100%; object-fit: contain; display: block; }
  #msg {
    position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-50%);
    text-align: center; pointer-events: none; color: #999;
    font: 13px system-ui, sans-serif;
  }
</style>
<video id="v" autoplay muted playsinline controls></video>
<div id="msg">loading…</div>
<script>
const v = document.getElementById('v');
const msg = document.getElementById('msg');
const base = location.pathname.replace(/\/+$/, '');
const src = base + '/index.m3u8';
const say = t => { msg.textContent = t || ''; };

// Pick on Media Source Extensions, NOT on canPlayType.
//
// Chrome answers canPlayType('application/vnd.apple.mpegurl') with "maybe" and
// then cannot play a playlist from <video src> at all: it parks at readyState 0
// / networkState 2 and never fires an error, so nothing below recovers and
// hls.js is never even fetched. This page sat on "loading…" forever on every
// desktop browser, which was only survivable because the streams were normally
// watched in VLC. Safari/iOS is the real native case and has no MSE, so that is
// the thing worth testing for; everywhere else hls.js does the work and gives
// us the error recovery an unattended display needs.
if (!('MediaSource' in window) && !('ManagedMediaSource' in window)) {
  v.src = src;
  v.addEventListener('loadeddata', () => say(''));
  v.addEventListener('error', () => say('stream unavailable — retrying'));
  setInterval(() => { if (v.error || v.readyState === 0) v.src = src; }, 5000);
} else {
  const s = document.createElement('script');
  s.src = base + '/hls.js';
  s.onerror = () => say('could not load player');
  s.onload = () => {
    if (!window.Hls || !Hls.isSupported()) return say('HLS not supported here');
    const hls = new Hls({ lowLatencyMode: true, backBufferLength: 10 });
    hls.on(Hls.Events.MANIFEST_PARSED, () => say(''));
    // A scoreboard runs unattended for hours: recover from network and media
    // errors in place instead of leaving a dead black frame on screen.
    hls.on(Hls.Events.ERROR, (_e, data) => {
      if (!data.fatal) return;
      say(data.details || 'error');
      if (data.type === Hls.ErrorTypes.NETWORK_ERROR) hls.startLoad();
      else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) hls.recoverMediaError();
      else { hls.destroy(); setTimeout(() => location.reload(), 5000); }
    });
    hls.loadSource(src);
    hls.attachMedia(v);
    // Stall watchdog. The error handlers above only fire when hls.js NOTICES
    // something; the failure that actually bites here is the silent one — the
    // server goes away (a deploy, a docker restart, the 02:00 kernel reboot)
    // and the picture simply stops on a frame with no error at all. That is
    // exactly how VLC dies, and a wall display should not need a human.
    //
    // Watch currentTime rather than any event: if it has not advanced while we
    // are meant to be playing, the picture on screen is a lie regardless of the
    // reason. Nudge the loader first, then reload the page if that fails.
    let lastT = 0, stalledFor = 0;
    setInterval(() => {
      if (v.paused || v.seeking) return;
      if (v.currentTime > lastT) { lastT = v.currentTime; stalledFor = 0; say(''); return; }
      stalledFor += 5;
      if (stalledFor < 15) return;
      say('stream stalled — reconnecting');
      if (stalledFor < 45) { hls.startLoad(); v.play().catch(() => {}); }
      else location.reload();
    }, 5000);

    // Muted autoplay is allowed, but a hidden or backgrounded tab still defers
    // playback — ask explicitly and let an autoplay-blocked page start on the
    // first user gesture rather than sitting on a black rectangle.
    hls.on(Hls.Events.MANIFEST_PARSED, () => v.play().catch(() => {}));
  };
  document.head.appendChild(s);
}
</script>
